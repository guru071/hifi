<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HIFI - Cart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        /* Base Styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }

        /* Typography Mapping (Custom utility classes for ease, though config is used below) */
        .text-body-md-mapped { font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.6; font-weight: 400; }
        .text-headline-xl-mapped { font-family: 'Inter', sans-serif; font-size: 40px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 600; }
        .text-label-sm-mapped { font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1; letter-spacing: 0.05em; font-weight: 600; }
        
        /* Smooth Scrolling */
        html { scroll-behavior: smooth; }
    </style>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#eeeeee",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f1f1f1",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#848484",
                        "on-surface": "#1b1b1b",
                        "on-secondary-container": "#616363",
                        "tertiary-fixed": "#e2e2e2",
                        "surface-variant": "#e2e2e2",
                        "outline": "#7e7576",
                        "on-background": "#1b1b1b",
                        "outline-variant": "#cfc4c5",
                        "on-error": "#ffffff",
                        "primary-container": "#1b1b1b",
                        "on-primary-fixed-variant": "#474747",
                        "primary-fixed": "#e2e2e2",
                        "tertiary": "#000000",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#4c4546",
                        "secondary-fixed-dim": "#c6c6c7",
                        "surface-container-highest": "#e2e2e2",
                        "surface-tint": "#5e5e5e",
                        "surface-container-low": "#f3f3f3",
                        "primary": "#000000",
                        "on-tertiary-fixed": "#1b1b1b",
                        "on-secondary-fixed": "#1a1c1c",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "inverse-surface": "#303030",
                        "surface-dim": "#dadada",
                        "primary-fixed-dim": "#c6c6c6",
                        "on-primary": "#ffffff",
                        "secondary-container": "#dfe0e0",
                        "surface": "#f9f9f9",
                        "background": "#f9f9f9",
                        "secondary": "#5d5f5f",

                        "on-primary-fixed": "#1b1b1b",
                        "on-primary-container": "#848484",

                        "secondary-fixed": "#e2e2e2",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#454747",
                        "inverse-primary": "#c6c6c6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "gutter": "24px",
                        "margin-desktop": "64px",
                        "section-gap": "128px",
                        "container-max": "1440px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "headline-xl": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],

                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],

                    }
                }
            }
        }

<body class="bg-background min-h-screen flex flex-col relative pt-[100px]">
<!-- TopNavBar (Transactional Intent - Minimal/Hidden, but instructions say to render JSON components. Since it's a shopping cart, it's transactional, I will suppress the full navigation shell and only show a minimal brand anchor as per rules "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional... Checkout". However, the cart is often a step before checkout. Let's provide a minimal top bar.) -->
<header class="fixed top-4 left-1/2 -translate-x-1/2 w-[90%] rounded-full bg-white/70 backdrop-blur-3xl border border-white/20 shadow-2xl flex justify-between items-center px-8 py-3 max-w-container-max z-50">
<div class="font-display-lg text-headline-xl tracking-tighter text-primary">HIFI</div>
<div class="flex items-center gap-6">
<button class="text-primary hover:text-primary/70 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">shopping_bag</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-12 md:py-16">
<div class="mb-12">
<h1 class="font-headline-xl text-headline-xl text-on-surface">Your Cart</h1>
</div>
<div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter items-start">
<!-- Left Column: Cart Items -->
<div class="lg:col-span-8 flex flex-col gap-8">
<!-- Cart Item Card -->
<div class="flex flex-col sm:flex-row gap-6 p-6 bg-surface-container-lowest rounded-xl border border-black/5 shadow-[0_10px_40px_rgba(0,0,0,0.04)]">
<!-- Product Image -->
<div class="w-full sm:w-[240px] shrink-0 bg-surface-container rounded-lg overflow-hidden relative group">
<img alt="The Heavyweight Tee" class="w-full h-full object-cover aspect-[4/5] mix-blend-multiply group-hover:scale-105 transition-transform duration-500 ease-out" src="https://lh3.googleusercontent.com/aida/AEtjO1WX2BasjrqIiFlwF9rlVSal9b0yG54DTBpBRnIu40wMZI876OVUaNyJthIsiXsAT7SJYjy2FEZwghZTUIiykZZT8LOyKb3_WOyMflUX_gqg9lDbp-QkV1sv4jQ2mfp7bO4HjZDQIFLodP4KL6tUfGVb9iFP1laYjBSWJN-ALU0PlX1lN1AQRdT3iszi_GBmN8ZHT9wrP89_2rckJodhb8Qysoz3LNcvfhcayKeWwmexf9rLuEVdiVmKF14"/>
</div>
<!-- Item Details -->
<div class="flex flex-col flex-grow justify-between py-2">
<div class="flex justify-between items-start gap-4">
<div>
<h3 class="font-body-lg text-body-lg font-semibold text-on-surface mb-2">The Heavyweight Tee</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-1">Color: Onyx</p>
<p class="font-body-md text-body-md text-on-surface-variant">Size: M</p>
<div class="mt-4 flex items-center gap-3">
<span class="material-symbols-outlined text-secondary text-sm">design_services</span>
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Custom Design Received</span>
</div>
</div>
<div class="text-right">
<span class="font-body-lg text-body-lg font-semibold text-on-surface">$85.00</span>
</div>
</div>
<!-- Actions -->
<div class="flex items-center justify-between mt-8 pt-6 border-t border-outline-variant/30">
<!-- Quantity Selector -->
<div class="flex items-center border border-outline-variant rounded-full overflow-hidden">
<button aria-label="Decrease quantity" class="px-4 py-2 text-on-surface hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
<span class="px-4 font-body-md text-body-md font-semibold w-12 text-center">1</span>
<button aria-label="Increase quantity" class="px-4 py-2 text-on-surface hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
<button class="text-secondary hover:text-error transition-colors flex items-center gap-2 group">
<span class="font-label-sm text-label-sm uppercase tracking-wider group-hover:underline">Remove</span>
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
</div>
</div>
</div>
<!-- Right Column: Summary Panel -->
<div class="lg:col-span-4 sticky top-32">
<div class="glass-panel rounded-2xl p-8 flex flex-col gap-6">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Summary</h2>
<div class="flex flex-col gap-4 border-b border-outline-variant/30 pb-6">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Subtotal</span>
<span class="font-body-md text-body-md font-semibold text-on-surface">$85.00</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Shipping</span>
<span class="font-body-md text-body-md text-on-surface-variant text-right">Calculated at next step</span>
</div>
</div>
<div class="flex justify-between items-end pt-2">
<span class="font-body-lg text-body-lg font-semibold text-on-surface">Total</span>
<div class="text-right">
<span class="font-headline-lg text-headline-lg text-on-surface block leading-none">$85.00</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mt-2 block">USD</span>
</div>
</div>
<button class="mt-6 w-full bg-primary text-on-primary py-4 px-8 rounded-full font-label-sm text-label-sm uppercase tracking-widest hover:bg-primary/90 hover:scale-[0.98] transition-all duration-300 ease-[cubic-bezier(0.34,1.56,0.64,1)]">
                        Secure Checkout
                    </button>
<div class="flex items-center justify-center gap-2 mt-4 text-on-surface-variant">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-sm text-label-sm uppercase">SSL Encrypted</span>
</div>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full bg-surface-container-lowest border-t border-outline-variant mt-auto">
<div class="max-w-container-max mx-auto px-margin-desktop py-section-gap grid grid-cols-1 md:grid-cols-4 gap-gutter">
<div class="col-span-1 md:col-span-1">
<div class="font-display-lg text-headline-lg text-primary mb-4">HIFI</div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">© 2024 HIFI PREMIUM CUSTOMS</p>
</div>
<div class="col-span-1 md:col-span-3 grid grid-cols-2 md:grid-cols-4 gap-8">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">Shipping Info</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">Contact Us</a>
</div>
</div>
</footer>
</body></html>
